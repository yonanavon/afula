name: סנכרון נתונים מהגיליון

on:
  schedule:
    - cron: '17 * * * *'   # כל שעה
  workflow_dispatch:        # אפשר גם להריץ ידנית מלשונית Actions

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: משיכת הגיליון
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync.mjs

      - name: שמירת השינויים
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "אין שינויים בגיליון."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "סנכרון נתונים מהגיליון"
          git push
